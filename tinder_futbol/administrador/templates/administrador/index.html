<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Partido - Tinder Fútbol</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #e5e7eb; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .app-container { background-color: #ffffff; width: 100%; max-width: 400px; min-height: 85vh; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        
        /* Navegación Superior Premium */
        .top-nav { display: flex; align-items: center; padding: 25px 20px; border-bottom: 1px solid #f3f4f6; }
        /* Flecha en verde cancha */
        .back-btn { text-decoration: none; color: #10b981; font-size: 1.8rem; font-weight: bold; margin-right: 20px; line-height: 1; transition: opacity 0.2s; }
        .back-btn:active { opacity: 0.5; }
        .nav-title { font-weight: 800; font-size: 1.2rem; color: #111827; letter-spacing: -0.5px; }

        /* Formulario Minimalista */
        .form-content { padding: 30px 25px; flex-grow: 1; overflow-y: auto; }
        
        .input-group { margin-bottom: 30px; }
        .input-group label { display: block; font-size: 0.8rem; color: #6b7280; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Inputs elegantes interactivos */
        .input-clean { width: 100%; border: none; border-bottom: 2px solid #e5e7eb; padding: 8px 0 12px; font-size: 1.1rem; color: #111827; font-weight: 600; outline: none; transition: all 0.3s ease; background: transparent; }
        /* Al hacer clic, la línea se pone verde */
        .input-clean:focus { border-bottom-color: #10b981; }
        .input-clean::placeholder { color: #9ca3af; font-weight: 400; }
        
        select.input-clean { padding-right: 20px; -webkit-appearance: none; appearance: none; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"><path fill="%239ca3af" d="M7 10l5 5 5-5z"/></svg>') no-repeat right center; }

        /* Botón de Acción Fijo Abajo */
        .bottom-action { padding: 20px 25px 30px; background: #fff; }
        .btn-submit { width: 100%; padding: 18px; border-radius: 50px; background: linear-gradient(135deg, #047857, #10b981); color: white; border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); transition: transform 0.2s; }
        .btn-submit:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="top-nav">
            <a href="/" class="back-btn">←</a>
            <div class="nav-title">Armar Partido</div>
        </div>

        <div class="form-content">
            <form action="#">
                <div class="input-group">
                    <label>Sede / Cancha</label>
                    <input type="text" class="input-clean" placeholder="Ej: El Monumental 5, Palermo">
                </div>

                <div class="input-group">
                    <label>Fecha</label>
                    <input type="date" class="input-clean">
                </div>

                <div class="input-group">
                    <label>Horario</label>
                    <input type="time" class="input-clean">
                </div>

                <div class="input-group">
                    <label>Faltan</label>
                    <select class="input-clean">
                        <option>1 jugador</option>
                        <option>2 jugadores</option>
                        <option>3 jugadores</option>
                        <option>4+ jugadores</option>
                    </select>
                </div>
            </form>
        </div>

        <div class="bottom-action">
            <button class="btn-submit">Publicar para Match</button>
        </div>
    </div>

</body>
</html>
